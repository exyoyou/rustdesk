// 屏幕监控相关的 Gradle 子模块。由 settings.gradle 一行引入，避免上游 settings.gradle 反复冲突。
// 宿主 app 只依赖 :monitor-runtime，其余模块由它传递引入，但 Gradle 要求每个子项目都在这里声明。
include ':opencv'
include ':monitor-logger'
include ':monitor-config'
include ':monitor-webdav'
include ':monitor-sync'
include ':monitor-amap'
include ':monitor-screen'
include ':monitor-proxy' // [monitor-proxy]
include ':monitor-runtime'

// [monitor-proxy] begin
// monitor-proxy 的 libXray.aar 放在其 libs 目录里（flatDir），宿主解析传递依赖时也需要能找到它。
gradle.beforeProject { Project p ->
    p.repositories { flatDir { dirs "${rootDir}/monitor-proxy/libs" } }
}
// [monitor-proxy] end

// opencv SDK 的 Java 目标是 17，但它没有设置 Kotlin 的 jvmTarget，会默认取 JDK 版本（如 21）导致两者不一致。
// 在这里统一设置，避免修改 opencv SDK 本身。
gradle.beforeProject { Project p ->
    if (p.path == ':opencv') {
        p.tasks.configureEach { task ->
            if (task.hasProperty('kotlinOptions')) {
                task.kotlinOptions.jvmTarget = '17'
            }
        }
    }
}
